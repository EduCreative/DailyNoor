<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Emerald Gradient -->
    <radialGradient id="emeraldBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0E6B46" />
      <stop offset="60%" stop-color="#084D31" />
      <stop offset="100%" stop-color="#042618" />
    </radialGradient>

    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3CD" />
      <stop offset="25%" stop-color="#E5C76B" />
      <stop offset="50%" stop-color="#C9A227" />
      <stop offset="75%" stop-color="#E5C76B" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>

    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="50%" stop-color="#E5C76B" />
      <stop offset="100%" stop-color="#B88E1B" />
    </linearGradient>

    <!-- Noor Halo Glow -->
    <radialGradient id="noorGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#E5C76B" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#C9A227" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#0B5D3C" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B5D3C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FDF3CD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Shield / Container -->
  <rect width="512" height="512" rx="112" fill="url(#emeraldBg)" />
  
  <!-- Outer Filigree Border -->
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-opacity="0.6" />
  <rect x="30" y="30" width="452" height="452" rx="84" fill="none" stroke="url(#goldFoil)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" />

  <!-- Noor Celestial Glow -->
  <circle cx="256" cy="245" r="190" fill="url(#noorGlow)" />

  <!-- 1. Background Islamic Geometric Rosette (Girih 16-fold & 8-fold Mandala) -->
  <g transform="translate(256, 245)" opacity="0.28" stroke="url(#goldFoil)" stroke-width="1.2" fill="none">
    <!-- Concentric Sacred Circles -->
    <circle r="180" />
    <circle r="150" stroke-dasharray="4 4" />
    <circle r="110" />
    <circle r="75" />

    <!-- 8 Overlapping Squares / Rub el Hizb Pattern -->
    <rect x="-105" y="-105" width="210" height="210" rx="4" />
    <rect x="-105" y="-105" width="210" height="210" rx="4" transform="rotate(45)" />
    <rect x="-105" y="-105" width="210" height="210" rx="4" transform="rotate(22.5)" stroke-opacity="0.5" />
    <rect x="-105" y="-105" width="210" height="210" rx="4" transform="rotate(67.5)" stroke-opacity="0.5" />

    <!-- 16 Radiating Noor Rays -->
    <g stroke-width="1" stroke-opacity="0.6">
      <line x1="0" y1="-180" x2="0" y2="-120" />
      <line x1="0" y1="180" x2="0" y2="120" />
      <line x1="-180" y1="0" x2="-120" y2="0" />
      <line x1="180" y1="0" x2="120" y2="0" />
      <line x1="-127" y1="-127" x2="-85" y2="-85" />
      <line x1="127" y1="127" x2="85" y2="85" />
      <line x1="-127" y1="127" x2="-85" y2="85" />
      <line x1="127" y1="-127" x2="85" y2="-85" />
      <line x1="-68" y1="-166" x2="-45" y2="-110" />
      <line x1="68" y1="166" x2="45" y2="110" />
      <line x1="-166" y1="-68" x2="-110" y2="-45" />
      <line x1="166" y1="68" x2="110" y2="45" />
      <line x1="68" y1="-166" x2="45" y2="-110" />
      <line x1="-68" y1="166" x2="-45" y2="110" />
      <line x1="166" y1="-68" x2="110" y2="-45" />
      <line x1="-166" y1="68" x2="-110" y2="45" />
    </g>

    <!-- Arabesque Trefoil Petals radiating from center -->
    <path d="M0 -75 Q25 -110 0 -145 Q-25 -110 0 -75" fill="url(#goldFoil)" fill-opacity="0.15" />
    <path d="M0 75 Q25 110 0 145 Q-25 110 0 75" fill="url(#goldFoil)" fill-opacity="0.15" />
    <path d="M-75 0 Q-110 25 -145 0 Q-110 -25 -75 0" fill="url(#goldFoil)" fill-opacity="0.15" />
    <path d="M75 0 Q110 25 145 0 Q110 -25 75 0" fill="url(#goldFoil)" fill-opacity="0.15" />
    <path d="M-53 -53 Q-78 -103 -103 -103 Q-103 -78 -53 -53" fill="url(#goldFoil)" fill-opacity="0.15" />
    <path d="M53 53 Q78 103 103 103 Q103 78 53 53" fill="url(#goldFoil)" fill-opacity="0.15" />
    <path d="M-53 53 Q-78 103 -103 103 Q-103 78 -53 53" fill="url(#goldFoil)" fill-opacity="0.15" transform="scale(-1, 1)" />
    <path d="M53 -53 Q78 -103 103 -103 Q103 -78 53 -53" fill="url(#goldFoil)" fill-opacity="0.15" transform="scale(-1, 1)" />
  </g>

  <!-- 2. Arabesque Ornate Crescent Moon (Hilal) -->
  <g filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.45))">
    <!-- Main Crescent Body -->
    <path d="M285 110 C185 110 110 185 110 275 C110 365 185 430 275 430 C322 430 362 414 394 384 C285 390 198 310 198 215 C198 160 230 125 285 110 Z" 
          fill="url(#goldFoil)" />

    <!-- Crescent Inner Shimmer Accent -->
    <path d="M272 125 C195 135 132 195 132 272 C132 345 190 405 268 412 C210 395 165 340 165 272 C165 205 208 150 272 125 Z" 
          fill="#FFF4D0" opacity="0.6" />

    <!-- Islamic Floral Carving on the Crescent Horn -->
    <path d="M190 275 Q205 240 230 235 Q205 255 190 275 Z" fill="#997A15" opacity="0.4" />
    <path d="M185 310 Q210 290 235 300 Q205 315 185 310 Z" fill="#997A15" opacity="0.4" />
    <path d="M175 230 Q195 200 220 205 Q195 215 175 230 Z" fill="#997A15" opacity="0.4" />
  </g>

  <!-- 3. Sacred 8-Point Islamic Star (Kawkab / Rub el Hizb) with Noor Core -->
  <g transform="translate(340, 215)">
    <!-- Star Glow -->
    <circle cx="0" cy="0" r="60" fill="url(#starGlow)" />

    <!-- Outer Interlocking Gold Octagram -->
    <g filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.35))">
      <!-- Square 1 -->
      <rect x="-38" y="-38" width="76" height="76" rx="4" fill="url(#goldFoil)" />
      <!-- Square 2 rotated 45 deg -->
      <rect x="-38" y="-38" width="76" height="76" rx="4" fill="url(#goldFoil)" transform="rotate(45)" />

      <!-- Inner Contrasting Emerald Octagram Inset -->
      <rect x="-28" y="-28" width="56" height="56" rx="2" fill="#0B5D3C" />
      <rect x="-28" y="-28" width="56" height="56" rx="2" fill="#0B5D3C" transform="rotate(45)" />

      <!-- Golden Center Rosette -->
      <circle cx="0" cy="0" r="16" fill="url(#goldLinear)" />
      <!-- Radiant Pearl Core -->
      <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
      
      <!-- Tiny 8 Petals inside rosette -->
      <g stroke="#0B5D3C" stroke-width="1.5" opacity="0.75">
        <line x1="0" y1="-14" x2="0" y2="14" />
        <line x1="-14" y1="0" x2="14" y2="0" />
        <line x1="-10" y1="-10" x2="10" y2="10" />
        <line x1="-10" y1="10" x2="10" y2="-10" />
      </g>
    </g>
  </g>

  <!-- 4. Secondary Twinkling Noor Star -->
  <g transform="translate(395, 305) scale(0.65)" filter="drop-shadow(0px 2px 6px rgba(0,0,0,0.3))">
    <circle cx="0" cy="0" r="28" fill="url(#starGlow)" />
    <!-- 8-point Star -->
    <path d="M0 -30 L7 -8 L30 0 L7 8 L0 30 L-7 8 L-30 0 L-7 -8 Z" fill="url(#goldFoil)" />
    <path d="M-21 -21 L0 -7 L21 -21 L7 0 L21 21 L0 7 L-21 21 L-7 0 Z" fill="#FFF0BE" opacity="0.8" />
    <circle cx="0" cy="0" r="4" fill="#0B5D3C" />
  </g>

  <!-- 5. Open Holy Quran / Rehal Stand Silhouette (Foundation of Daily Noor) -->
  <g transform="translate(256, 395)" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.4))">
    <!-- Rehal wooden stand crossed legs -->
    <path d="M-45 35 L0 8 L45 35 L35 40 L0 16 L-35 40 Z" fill="url(#goldFoil)" opacity="0.8" />
    
    <!-- Open Book Pages with sacred curvature -->
    <!-- Left Page -->
    <path d="M0 6 C-18 -2 -42 0 -62 14 C-65 16 -63 26 -58 24 C-40 12 -18 10 0 16 Z" fill="#FDF8EE" />
    <path d="M-2 8 C-18 2 -38 4 -56 16" stroke="url(#goldFoil)" stroke-width="1.2" fill="none" opacity="0.8" />
    <path d="M-10 13 C-22 9 -36 11 -50 20" stroke="#0B5D3C" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M-10 16 C-22 12 -36 14 -48 22" stroke="#0B5D3C" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Right Page -->
    <path d="M0 6 C18 -2 42 0 62 14 C65 16 63 26 58 24 C40 12 18 10 0 16 Z" fill="#FDF8EE" />
    <path d="M2 8 C18 2 38 4 56 16" stroke="url(#goldFoil)" stroke-width="1.2" fill="none" opacity="0.8" />
    <path d="M10 13 C22 9 36 11 50 20" stroke="#0B5D3C" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M10 16 C22 12 36 14 48 22" stroke="#0B5D3C" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Book Spine Rib Ribbon in Gold -->
    <path d="M0 6 L0 26" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 6. Four Corner Arabesque Ornaments -->
  <g stroke="url(#goldFoil)" stroke-width="1.8" fill="none" opacity="0.65">
    <!-- Top Left -->
    <path d="M45 75 Q75 75 75 45 M45 60 Q60 60 60 45" />
    <circle cx="75" cy="75" r="2.5" fill="url(#goldFoil)" />

    <!-- Top Right -->
    <path d="M467 75 Q437 75 437 45 M467 60 Q452 60 452 45" />
    <circle cx="437" cy="75" r="2.5" fill="url(#goldFoil)" />

    <!-- Bottom Left -->
    <path d="M45 437 Q75 437 75 467 M45 452 Q60 452 60 467" />
    <circle cx="75" cy="437" r="2.5" fill="url(#goldFoil)" />

    <!-- Bottom Right -->
    <path d="M467 437 Q437 437 437 467 M467 452 Q452 452 452 467" />
    <circle cx="437" cy="437" r="2.5" fill="url(#goldFoil)" />
  </g>
</svg>
